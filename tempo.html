<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;500;700&display=swap"
        rel="stylesheet">

    <title>Fernando - Previsão do tempo</title>

    <link rel="stylesheet" href="tempo.css">
</head>

<body>

    <div class="caixa-maior">

        <input class="input-cidade" placeholder="Digite o nome da cidade">

        <button class="botao-busca" onclick="cliqueinoBotao()">

            <img class="img-busca"
                alt="Busca"
                src="https://www.svgrepo.com/show/488200/find.svg">

        </button>

        <div class="caixa-media">

            <h2 class="cidade">Pesquisa não realizada</h2>

            <p class="temp">°C</p>

            <div class="caixa-menor">

                <img class="img-previsao"
                    alt="icone-info-tempo"
                    src="http://openweathermap.org/img/wn/04n.png">

                <p class="texto-previsao">Pesquisa não realizada</p>

            </div>

            <div class="caixa-detalhes">

                <p class="umidade">Umidade: 0%</p>

                <p class="vento">Vento: 0 km/h</p>

            </div>

            <h3 class="titulo-previsao-dias">Próximos 5 Dias</h3>

            <div class="container-previsao-dias" id="previsao-dias">

                <div class="card-dia">
                    <p class="nome-dia">---</p>

                    <div class="container-temps">
                        <span class="max">--°</span>
                        <span class="min">--°</span>
                    </div>
                </div>

                <div class="card-dia">
                    <p class="nome-dia">---</p>

                    <div class="container-temps">
                        <span class="max">--°</span>
                        <span class="min">--°</span>
                    </div>
                </div>

                <div class="card-dia">
                    <p class="nome-dia">---</p>

                    <div class="container-temps">
                        <span class="max">--°</span>
                        <span class="min">--°</span>
                    </div>
                </div>

                <div class="card-dia">
                    <p class="nome-dia">---</p>

                    <div class="container-temps">
                        <span class="max">--°</span>
                        <span class="min">--°</span>
                    </div>
                </div>

                <div class="card-dia">
                    <p class="nome-dia">---</p>

                    <div class="container-temps">
                        <span class="max">--°</span>
                        <span class="min">--°</span>
                    </div>
                </div>

            </div>

            

        </div>

    </div>

    <script src="tempo.js">

       
    </script>

</body>

</html>
